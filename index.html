<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wave</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#D55F45">
  <link rel="icon" href="icon-192.png">
  <style>
    body {
      background: #121212;
      color: white;
      font-family: 'Ink Free', cursive;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 16px;
      width: 320px;
      text-align: center;
    }
    h1 { font-size: 22px; margin-top: 0; }
    #art {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 14px;
      background: #121212;
    }
    #viz {
      width: 100%;
      height: 60px;
      display: block;
      margin: 12px 0 0;
    }
    #title { word-break: break-word; }
    button {
      background: #D55F45;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 16px;
      font-family: inherit;
      cursor: pointer;
      margin: 4px;
    }
    button:hover { background: #e8765c; }
    button.active, button.active:hover {
      background: white;
      color: #D55F45;
    }
    input[type="range"] {
      width: 100%;
      margin: 12px 0;
      accent-color: #D55F45;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Wave</h1>

    <img id="art" src="icon-512.png" alt="Album artwork">
    <canvas id="viz" width="520" height="120"></canvas>
    <p id="title"></p>

    <audio id="player"></audio>

    <button onclick="prevSong()">Prev</button>
    <button onclick="player.play()">Play</button>
    <button onclick="player.pause()">Pause</button>
    <button onclick="nextSong()">Next</button>
    <br>
    <button id="shuffleBtn" onclick="toggleShuffle()">Shuffle</button>
    <button id="loopBtn" onclick="toggleLoop()">Loop</button>

    <input type="range" min="0" max="1" step="0.01" value="1"
      oninput="player.volume = this.value">

    <input type="range" id="progress" value="0" min="0" max="100" step="0.1">
    <p id="time">0:00 / 0:00</p>

    <button onclick="filePicker.click()">Choose files</button>
    <button onclick="folderPicker.click()">Choose folder</button>

    <input type="file" id="filePicker" class="hidden" accept="audio/*" multiple>
    <input type="file" id="folderPicker" class="hidden" webkitdirectory>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <script>
    const player = document.getElementById('player');
    const progress = document.getElementById('progress');
    const title = document.getElementById('title');
    const time = document.getElementById('time');
    const art = document.getElementById('art');
    const filePicker = document.getElementById('filePicker');
    const folderPicker = document.getElementById('folderPicker');
    const DEFAULT_ART = 'icon-512.png';

    // ---- YOUR SONGS: keep your own file names here ----
    const songs = ['song.mp3', 'song2.mp3', 'song3.mp3'];

    // each song is an object: a name, where to play it from, and (for picked files) the file itself
    let playlist = songs.map(function (n) { return { name: n, src: n }; });
    let current = 0;
    let shuffle = false;
    let artLoad = 0;

    // ---- loading songs ----
    function loadSong(index) {
      current = index;
      const item = playlist[current];
      player.src = item.src;
      title.textContent = item.name.replace(/\.[^.]+$/, '');  // hide the .mp3
      loadArtwork(item);
    }

    function loadArtwork(item) {
      art.src = DEFAULT_ART;
      if (typeof jsmediatags === 'undefined') return;  // library didn't load (e.g. offline)
      const thisLoad = ++artLoad;
      const source = item.file || new URL(item.src, location.href).href;
      jsmediatags.read(source, {
        onSuccess: function (result) {
          const pic = result.tags.picture;
          if (pic && thisLoad === artLoad) {
            const blob = new Blob([new Uint8Array(pic.data)], { type: pic.format });
            art.src = URL.createObjectURL(blob);
          }
        },
        onError: function () { /* no artwork in this file: keep the default */ }
      });
    }

    function addFiles(list) {
      const files = Array.from(list)
        .filter(function (f) {
          return f.type.startsWith('audio/') || /\.(mp3|m4a|wav|ogg|flac|aac|opus)$/i.test(f.name);
        })
        .sort(function (a, b) {
          return a.name.localeCompare(b.name, undefined, { numeric: true });
        });
      if (files.length === 0) return;

      playlist = files.map(function (f) {
        return { name: f.name, src: URL.createObjectURL(f), file: f };
      });
      loadSong(0);
      player.play();
    }

    filePicker.addEventListener('change', function () { addFiles(filePicker.files); });
    folderPicker.addEventListener('change', function () { addFiles(folderPicker.files); });

    // ---- controls ----
    function nextSong() {
      if (shuffle && playlist.length > 1) {
        let n;
        do {
          n = Math.floor(Math.random() * playlist.length);
        } while (n === current);
        loadSong(n);
      } else {
        loadSong((current + 1) % playlist.length);
      }
      player.play();
    }

    function prevSong() {
      loadSong((current - 1 + playlist.length) % playlist.length);
      player.play();
    }

    function toggleShuffle() {
      shuffle = !shuffle;
      document.getElementById('shuffleBtn').classList.toggle('active', shuffle);
    }

    function toggleLoop() {
      player.loop = !player.loop;
      document.getElementById('loopBtn').classList.toggle('active', player.loop);
    }

    // ---- time + progress ----
    function formatTime(seconds) {
      if (isNaN(seconds)) return '0:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return m + ':' + String(s).padStart(2, '0');
    }

    function updateTime() {
      time.textContent = formatTime(player.currentTime) + ' / ' + formatTime(player.duration);
    }

    player.addEventListener('timeupdate', function () {
      progress.value = (player.currentTime / player.duration) * 100;
      updateTime();
    });
    player.addEventListener('loadedmetadata', updateTime);
    player.addEventListener('ended', nextSong);

    progress.addEventListener('input', function () {
      player.currentTime = (progress.value / 100) * player.duration;
    });

    // ---- live waveform ----
    const canvas = document.getElementById('viz');
    const ctx = canvas.getContext('2d');
    let audioCtx, analyser, dataArray;

    function setupAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaElementSource(player);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 128;
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      draw();
    }

    function draw() {
      requestAnimationFrame(draw);
      analyser.getByteFrequencyData(dataArray);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const bars = 24;
      const slot = canvas.width / bars;
      const barW = slot * 0.55;
      ctx.fillStyle = '#D55F45';

      for (let i = 0; i < bars; i++) {
        const value = dataArray[Math.floor(i * dataArray.length * 0.7 / bars)];
        const h = Math.max(8, (value / 255) * canvas.height);
        const x = i * slot + (slot - barW) / 2;
        const y = (canvas.height - h) / 2;
        ctx.beginPath();
        ctx.roundRect(x, y, barW, h, barW / 2);
        ctx.fill();
      }
    }

    // browsers only allow audio to start after a tap, so we set it up on the first play
    player.addEventListener('play', function () {
      setupAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    });

    loadSong(0);

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
