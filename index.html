<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wave</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#D55F45">
<link rel="icon" href="icon-192.png">
  <style>
    body {
      background: #121212;
      color: white;
      font-family: 'Ink Free', cursive;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 16px;
      width: 320px;
      text-align: center;
    }
    h1 { font-size: 22px; margin-top: 0; }
    button {
      background: #D55F45;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 16px;
      font-family: inherit;
      cursor: pointer;
      margin: 4px;
    }
    button:hover { background: #e8765c; }
    button.active, button.active:hover {
      background: white;
      color: #D55F45;
    }
    input[type="range"] {
      width: 100%;
      margin: 12px 0;
      accent-color: #D55F45;
    }
    input[type="file"] { margin-top: 10px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Wave</h1>
    <p id="title"></p>

    <audio id="player"></audio>

    <button onclick="prevSong()">Prev</button>
    <button onclick="player.play()">Play</button>
    <button onclick="player.pause()">Pause</button>
    <button onclick="nextSong()">Next</button>
    <br>
    <button id="shuffleBtn" onclick="toggleShuffle()">Shuffle</button>
    <button id="loopBtn" onclick="toggleLoop()">Loop</button>

    <input type="range" min="0" max="1" step="0.01" value="1"
      oninput="player.volume = this.value">

    <input type="range" id="progress" value="0" min="0" max="100" step="0.1">
    <p id="time">0:00 / 0:00</p>

    <input type="file" id="picker" accept="audio/*">
  </div>

  <script>
    const player = document.getElementById('player');
    const progress = document.getElementById('progress');
    const title = document.getElementById('title');
    const time = document.getElementById('time');
    const picker = document.getElementById('picker');

    const songs = ['a.mp3', 'b.mp3', 'c.mp3', 'd.mp3', 'e.mp3', 'f.mp3', 'g.mp3', 'c.mp3', 'h.mp3', 'i.mp3', 'j.mp3', 'k.mp3', 'l.mp3', 'm.mp3', 'n.mp3', 'o.mp3'];  // your file names
    let current = 0;
    let shuffle = false;

    function loadSong(index) {
      current = index;
      player.src = songs[current];
      title.textContent = songs[current];
    }

    function nextSong() {
      if (shuffle && songs.length > 1) {
        let n;
        do {
          n = Math.floor(Math.random() * songs.length);
        } while (n === current);
        loadSong(n);
      } else {
        loadSong((current + 1) % songs.length);
      }
      player.play();
    }

    function prevSong() {
      loadSong((current - 1 + songs.length) % songs.length);
      player.play();
    }

    function toggleShuffle() {
      shuffle = !shuffle;
      document.getElementById('shuffleBtn').classList.toggle('active', shuffle);
    }

    function toggleLoop() {
      player.loop = !player.loop;
      document.getElementById('loopBtn').classList.toggle('active', player.loop);
    }

    function formatTime(seconds) {
      if (isNaN(seconds)) return '0:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return m + ':' + String(s).padStart(2, '0');
    }

    function updateTime() {
      time.textContent = formatTime(player.currentTime) + ' / ' + formatTime(player.duration);
    }

    player.addEventListener('timeupdate', function () {
      progress.value = (player.currentTime / player.duration) * 100;
      updateTime();
    });
    player.addEventListener('loadedmetadata', updateTime);
    player.addEventListener('ended', nextSong);

    progress.addEventListener('input', function () {
      player.currentTime = (progress.value / 100) * player.duration;
    });

    picker.addEventListener('change', function () {
      const file = picker.files[0];
      if (file) {
        player.src = URL.createObjectURL(file);
        title.textContent = file.name;
        player.play();
      }
    });

    loadSong(0);
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
  </script>
</body>
</html>
